# ==============================================================================
# DAWSON WELLS GALLERY — NGINX PRODUCTION REVERSE PROXY & STATIC CONFIG
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name dawsonwellsdesigns.com www.dawsonwellsdesigns.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dawsonwellsdesigns.com www.dawsonwellsdesigns.com;

    # SSL Certificates (Configure with your cert path, e.g. Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/dawsonwellsdesigns.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dawsonwellsdesigns.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;

    # Canonical 301 Redirects
    location = /work { return 301 /artworks; }
    location = /about-me-1 { return 301 /about; }
    location = /about-me { return 301 /about; }
    location = /overview { return 301 /about/overview; }
    location = /mission { return 301 /about/mission-vision; }

    # Static Assets & Image Optimization Caching
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(jpg|jpeg|png|webp|svg|ico|woff2|woff)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Manifests and AI context
    location ~* (site\.webmanifest|manifest\.json|llms\.txt|security\.txt|robots\.txt|sitemap\.xml)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 1d;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=86400";
    }

    # Reverse proxy to Next.js Node process
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
